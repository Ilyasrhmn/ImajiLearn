name: Backend verification

on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: imajilearn_test
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: imajilearn_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imajilearn_test -d imajilearn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://imajilearn_test:synthetic_ci_password@localhost:5432/imajilearn_test
      TEST_DATABASE_URL: postgresql://imajilearn_test:synthetic_ci_password@localhost:5432/imajilearn_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:http
